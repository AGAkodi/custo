name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  browser-e2e:
    runs-on: ubuntu-latest
    env:
      HYDRADB_PASSWORD: ci-local-graph-password-0123456789abcdef
      HYDRADB_URI: bolt://127.0.0.1:17687
      HYDRADB_USERNAME: neo4j
      REVIEWER_TOKEN: custos-ci-only
      CUSTOS_E2E_TOKEN: custos-ci-only
      GRAPH_NAMESPACE: custos_e2e_initial
      CUSTOS_RUNTIME_DIR: /tmp/custos-ci-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose up -d
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install ffmpeg
        working-directory: frontend
      - name: Start local services
        run: |
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/custos-api.log 2>&1) &
          (cd frontend && npm run dev -- --host 127.0.0.1 > /tmp/custos-ui.log 2>&1) &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/custos-api.log /tmp/custos-ui.log
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
